version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: kanoonpk_db
    environment:
      POSTGRES_DB: kanoonpk
      POSTGRES_USER: kanoonpk_user
      POSTGRES_PASSWORD: kanoonpk_secure_pass_2024
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - kanoonpk_network
    restart: unless-stopped
    
  redis:
    image: redis:7-alpine
    container_name: kanoonpk_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - kanoonpk_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  kanoonpk_network:
    driver: bridge