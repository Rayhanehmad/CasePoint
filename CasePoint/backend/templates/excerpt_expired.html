<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excerpt Expired - CasePoint</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/casepoint-brand.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #F9FAFB 0%, #E5E7EB 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .error-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(30, 58, 138, 0.1);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            text-align: center;
            max-width: 500px;
        }
        
        .error-icon {
            font-size: 4rem;
            color: #F59E0B;
            margin-bottom: 1.5rem;
        }
        
        .error-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--cp-text-dark);
            margin-bottom: 1rem;
        }
        
        .error-text {
            color: #6B7280;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .btn-primary {
            background: var(--cp-primary);
            border: none;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: linear-gradient(90deg, #1E3A8A, #10B981);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(30, 58, 138, 0.3);
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-hourglass-end"></i>
        </div>
        <h1 class="error-title">Excerpt Expired</h1>
        <p class="error-text">
            This shared excerpt has expired or been revoked. Shared excerpts are only available for 90 days after creation for privacy and security reasons.
        </p>
        <a href="{{ url_for('index') }}" class="btn-primary">
            <i class="fas fa-home"></i> Go to Home
        </a>
    </div>
</body>
</html>
